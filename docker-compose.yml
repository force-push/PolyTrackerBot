version: '3.8'

services:
  polytracker:
    build: .
    container_name: polytracker-bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/polytracker.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - polytracker-net

networks:
  polytracker-net:
    driver: bridge
